version: '3.8'

services:
  # -------------------------------------------------------------
  # PostgreSQL Database Container
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smarthome_secure_password_123}
      POSTGRES_DB: ${DB_NAME:-smarthome_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-smarthome_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # -------------------------------------------------------------
  # Express Backend API Container
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smarthome-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-smarthome_secure_password_123}@postgres:5432/${DB_NAME:-smarthome_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-production_super_secret_jwt_key_at_smart_living}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - app-network

  # -------------------------------------------------------------
  # Next.js 16 Standalone Frontend Container
  # -------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smarthome-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_API_URL: http://backend:5000/api
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

  # -------------------------------------------------------------
  # Nginx Reverse Proxy (Handles Ports 80 & 443 + SSL)
  # -------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: smarthome-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

  # -------------------------------------------------------------
  # Certbot (Automatic SSL Certificate Renewal)
  # -------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: smarthome-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
